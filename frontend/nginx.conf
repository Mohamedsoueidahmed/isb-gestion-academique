# Serveur web du frontend academique (nginx) - version de production.
#
# Trois roles :
#   1. servir les pages de l'application ;
#   2. transmettre les appels /api au backend, a l'interieur de Docker ;
#   3. proteger l'acces : liste d'ordinateurs autorises + limite d'essais
#      de mot de passe.

# --- Limite d'essais de mot de passe ---------------------------------------
# Par ordinateur : 6 essais par minute (un toutes les 10 secondes), plus une
# petite rafale de 5. Au-dela, nginx repond 429 sans meme consulter le backend.
limit_req_zone $binary_remote_addr zone=connexion:1m rate=6r/m;
limit_req_status 429;

server {
    listen 80;
    server_tokens off;

    # DNS interne de Docker, interroge a nouveau toutes les 10 secondes : le
    # backend peut etre recree (nouvelle adresse) sans redemarrer nginx.
    resolver 127.0.0.11 valid=10s;

    # --- Ordinateurs autorises -----------------------------------------------
    # 127.0.0.1 = le conteneur lui-meme (controle de sante de Docker).
    # La vraie liste est dans acces-reseau/ordinateurs-autorises.inc, un dossier
    # du serveur monte dans le conteneur (voir docker-compose.yml). Sans ce
    # fichier, personne n'entre : c'est voulu.
    allow 127.0.0.1;
    include /etc/nginx/acces/*.inc;
    deny all;

    # Message en francais pour un ordinateur non autorise (au lieu de la page
    # anglaise de nginx). "allow all" ici est voulu : sans cela, la page
    # d'explication serait elle-meme refusee.
    error_page 403 @acces_refuse;
    location @acces_refuse {
        allow all;
        default_type text/html;
        charset utf-8;
        return 403 '<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accès refusé</title><body style="font-family:sans-serif;max-width:32rem;margin:4rem auto;padding:0 1rem;line-height:1.5"><h1>Accès refusé</h1><p>Cet ordinateur n’est pas autorisé à utiliser ce logiciel.</p><p>S’il devrait l’être, contactez l’administrateur du système.</p></body></html>';
    }

    # --- Transmission au backend ---------------------------------------------
    # Avec une variable dans proxy_pass, nginx transmet le chemin recu tel quel :
    # JAMAIS de chemin apres l'adresse (sinon /api/api/... et erreur 404).
    set $backend_academique backend-academique:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Le seul endroit ou l'on peut deviner un mot de passe : surveille de pres.
    location = /api/auth/connexion {
        limit_req zone=connexion burst=5 nodelay;
        proxy_pass http://$backend_academique;
    }

    location /api/ {
        proxy_pass http://$backend_academique;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}
